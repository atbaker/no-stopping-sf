name: Refresh and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://nostoppingsf.io
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --locked
      - run: npm test
      - name: Restore unchanged permit details
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data/permit_details.json
          key: permit-details-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: permit-details-v1-
      - name: Fetch and prepare a complete new snapshot
        run: npm run refresh
      - name: Save unchanged permit details
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data/permit_details.json
          key: permit-details-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive this public snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/dist/data/
          retention-days: 14
      - name: Publish static assets to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          command: deploy
      - name: Verify the published snapshot
        run: uv run --locked python scripts/verify_deployment.py https://nostoppingsf.io
      - name: Preserve refresh diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: refresh-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/download_metadata.json
            data/permit_photos.json
            data/photo_checkpoint.json
            data/photo_files_checkpoint.json
          retention-days: 7
